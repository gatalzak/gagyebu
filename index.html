<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#131315">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="가계부">
  <meta name="google-site-verification" content="jpXfUGsTTDKQSjkQubJNFCeuo1Zj98mid0nIIDpsm4s" />
  <meta name="description" content="개인용 가계부 웹앱. 데이터는 이 기기와 본인 구글 드라이브에만 저장됩니다.">
  <title>가탈작 가계부</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="eye-btn" id="eye-btn" hidden aria-label="금액 잠깐 보기"></button>
      <div class="month-nav">
        <button class="icon-btn" id="prev" aria-label="이전 달">‹</button>
        <button id="month-title" aria-label="날짜 고르기"></button>
        <button class="icon-btn" id="next" aria-label="다음 달">›</button>
      </div>
      <div class="top-row">
        <button class="ghost-btn" id="open-settings"><svg class="btn-ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>설정</button>
        <div class="top-actions">
          <button class="ghost-btn asset-tone" id="open-assets"><svg class="btn-ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2-2h11v4"/><path d="M4 7v10a2 2 0 0 0 2 2h13V9H6a2 2 0 0 1-2-2z"/><circle cx="15.5" cy="14" r="1"/></svg>나의 자산</button>
          <button class="ghost-btn debt-tone" id="open-debts"><svg class="btn-ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/></svg>나의 부채</button>
        </div>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="home">현황</button>
      <button role="tab" data-tab="list">내역</button>
      <button role="tab" data-tab="calendar">달력</button>
      <button role="tab" data-tab="monthly">월별</button>
      <button role="tab" data-tab="settle">결산</button>
    </nav>

    <button id="sync-bar" class="sync-bar" hidden></button>
    <div id="backup-bar" class="backup-bar" hidden></div>
    <main id="view"></main>
  </div>

  <button class="fab" id="fab" aria-label="내역 추가">+</button>
  <div id="modal-root"></div>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
